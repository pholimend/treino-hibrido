<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Treino Híbrido</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161A">
<meta name="description" content="Agenda diária do plano de treino híbrido — corrida + musculação.">

<!-- PWA / iOS -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino Híbrido">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app-shell" class="app-shell">

  <div id="scroll-region" class="scroll-region">
    <header class="topbar">
      <div class="topbar-row">
        <h1>Treino Híbrido</h1>
        <button id="btn-hoje" class="btn-hoje">Hoje</button>
      </div>
      <div id="contexto-atual" class="contexto"></div>
    </header>

    <nav id="bloco-seletor" class="bloco-seletor" aria-label="Selecionar bloco"></nav>
    <div id="semana-seletor" class="semana-seletor" aria-label="Selecionar semana ou ciclo"></div>
    <div id="dia-seletor" class="dia-seletor" aria-label="Selecionar dia"></div>

    <main id="conteudo-dia" class="conteudo-dia"></main>

    <div id="progresso-semana" class="progresso-semana"></div>
  </div>

  <footer class="acoes">
    <button id="btn-concluido" class="btn-concluido"></button>
    <button id="btn-mais" class="btn-mais">Mais ▾</button>
  </footer>

</div>

<div id="mais-backdrop" class="mais-backdrop"></div>
<div id="mais-sheet" class="mais-sheet">
  <div class="mais-topo">
    <span>Informações do plano</span>
    <button id="mais-fechar" aria-label="Fechar">✕</button>
  </div>
  <div id="mais-conteudo" class="mais-conteudo"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
