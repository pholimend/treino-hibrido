<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Treino Híbrido</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161A">
<meta name="description" content="Agenda diária do plano de treino híbrido — corrida + musculação.">

<!-- PWA / iOS -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino Híbrido">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1>Treino Híbrido</h1>
    <button id="btn-hoje" class="btn-hoje">Hoje</button>
  </div>
  <div id="contexto-atual" class="contexto"></div>
</header>

<nav id="bloco-seletor" class="bloco-seletor" aria-label="Selecionar bloco"></nav>
<div id="semana-seletor" class="semana-seletor" aria-label="Selecionar semana ou ciclo"></div>
<div id="dia-seletor" class="dia-seletor" aria-label="Selecionar dia"></div>

<main id="conteudo-dia" class="conteudo-dia"></main>

<div id="progresso-semana" class="progresso-semana"></div>

<footer class="acoes">
  <button id="btn-concluido" class="btn-concluido"></button>
  <button id="btn-mais" class="btn-mais">Mais ▾</button>
</footer>

<div id="mais-backdrop" class="mais-backdrop"></div>
<div id="mais-sheet" class="mais-sheet">
  <div class="mais-topo">
    <span>Mais</span>
    <button id="mais-fechar" class="topo-icon-btn" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="mais-conteudo" class="mais-conteudo"></div>
</div>

<div id="info-backdrop" class="mais-backdrop"></div>
<div id="info-sheet" class="mais-sheet">
  <div class="mais-topo">
    <button id="info-voltar" class="mais-topo-voltar topo-icon-btn" aria-label="Voltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span>Informações do plano</span>
    <button id="info-fechar" class="topo-icon-btn" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="info-conteudo" class="mais-conteudo"></div>
</div>

<div id="peso-backdrop" class="mais-backdrop"></div>
<div id="peso-sheet" class="mais-sheet">
  <div class="mais-topo">
    <button id="peso-voltar" class="mais-topo-voltar topo-icon-btn" aria-label="Voltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span>Meu peso</span>
    <button id="peso-fechar" class="topo-icon-btn" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="peso-conteudo" class="mais-conteudo"></div>
</div>

<div id="retomada-backdrop" class="mais-backdrop"></div>
<div id="retomada-sheet" class="mais-sheet">
  <div class="mais-topo">
    <button id="retomada-voltar-header" class="mais-topo-voltar topo-icon-btn" aria-label="Voltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span>Volta aos treinos</span>
    <button id="retomada-fechar" class="topo-icon-btn" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="retomada-conteudo" class="mais-conteudo"></div>
</div>

<div id="backup-backdrop" class="mais-backdrop"></div>
<div id="backup-sheet" class="mais-sheet">
  <div class="mais-topo">
    <button id="backup-voltar" class="mais-topo-voltar topo-icon-btn" aria-label="Voltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span>Backup e dados</span>
    <button id="backup-fechar" class="topo-icon-btn" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="backup-conteudo" class="mais-conteudo"></div>
</div>

<div id="backup-preview-backdrop" class="mais-backdrop"></div>
<div id="backup-preview-sheet" class="mais-sheet">
  <div class="mais-topo">
    <span>Restaurar backup</span>
    <button id="backup-previa-fechar" class="topo-icon-btn" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="backup-previa-conteudo" class="mais-conteudo"></div>
  <div class="backup-previa-acoes">
    <button id="backup-previa-cancelar" class="btn-backup btn-backup-secundario">Cancelar</button>
    <button id="backup-previa-restaurar" class="btn-backup btn-backup-perigo">Restaurar</button>
  </div>
</div>

<div id="app-toast" class="app-toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
